# derp.toml — generated by `derp init --infra` for demo-app
# Env vars (e.g. $WORKOS_API_KEY) are populated by
# `derp env pull <env>` after `terraform apply`.

[database]
db_url = "$DATABASE_URL"
schema_path = "app/schema.py"
migrations_dir = "./migrations"

[auth.workos]
api_key = "$WORKOS_API_KEY"
client_id = "$WORKOS_CLIENT_ID"
# redirect_uri = "https://yourapp.com/callback"

[storage]
endpoint_url = "$R2_ENDPOINT_URL"
access_key_id = "$R2_ACCESS_KEY_ID"
secret_access_key = "$R2_SECRET_ACCESS_KEY"
region = "auto"

[kv.valkey]
addresses = [["$UPSTASH_REDIS_HOST", "$UPSTASH_REDIS_PORT"]]
password = "$UPSTASH_REDIS_PASSWORD"
use_tls = true

[payments]
api_key = "$STRIPE_SECRET_KEY"
webhook_secret = "$STRIPE_WEBHOOK_SECRET"

[ai]
api_key = "$VERCEL_AI_API_KEY"
base_url = "$VERCEL_AI_BASE_URL"

[email]
site_name = "My App"
site_url = "https://yourdomain.com"
from_email = "$RESEND_FROM_EMAIL"
smtp_host = "smtp.resend.com"
smtp_port = 587
smtp_user = "resend"
smtp_password = "$RESEND_API_KEY"
use_tls = true

[queue.vercel]
api_token = "$VERCEL_QUEUE_TOKEN"
project_id = "$VERCEL_PROJECT_ID"
default_queue = "$VERCEL_QUEUE_DEFAULT"
